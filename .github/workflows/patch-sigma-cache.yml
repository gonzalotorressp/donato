'''
          new = '''function sigmaCacheKey(endpoint, fecha) {
  return `${endpoint}|${fecha}`;
}

function cachedSigmaReport(endpoint, fecha, maxAgeMs) {
  if (!maxAgeMs) return null;
  const cached = sigmaReportCache.get(sigmaCacheKey(endpoint, fecha));
  if (!cached || Date.now() - cached.fetchedAt > maxAgeMs) return null;
  return cached.data;
}

export function fetchSigmaReport(endpoint, fecha, options = {}) {
  const maxAgeMs = Math.max(0, Number(options.maxAgeMs || 0));
  const immediateCached = cachedSigmaReport(endpoint, fecha, maxAgeMs);
  if (immediateCached) return Promise.resolve(immediateCached);

  return enqueueSigma(async () => {
    // Otra invocación pudo completar la misma consulta mientras ésta esperaba la cola.
    const queuedCached = cachedSigmaReport(endpoint, fecha, maxAgeMs);
    if (queuedCached) return queuedCached;

    const url = new URL(endpoint);
    url.searchParams.set('fecdes', fecha);
    url.searchParams.set('fechas', fecha);

    const elapsed = Date.now() - lastSigmaCallAt;
    const initialWait = lastSigmaCallAt ? Math.max(0, SIGMA_MIN_INTERVAL_MS - elapsed) : 0;
    if (initialWait > 0) await sleep(initialWait);

    for (let attempt = 0; attempt < 2; attempt += 1) {
      const response = await fetch(url, { headers: headers() });
      lastSigmaCallAt = Date.now();

      if (response.status === 429) {
        const body = await response.text();
        const retryMs = retryDelayFromSigma(body) ?? SIGMA_MIN_INTERVAL_MS;
        if (attempt === 0) {
          await sleep(Math.max(250, retryMs + 250));
          continue;
        }
        throw new Error('Sigma está ocupado. Reintentá en unos segundos.');
      }

      if (!response.ok) {
        const body = await response.text();
        throw new Error(`Sigma ${response.status}: ${body.slice(0, 800)}`);
      }

      const data = await response.json();
      if (!Array.isArray(data)) throw new Error('Sigma no devolvió un array JSON');
      sigmaReportCache.set(sigmaCacheKey(endpoint, fecha), { fetchedAt: Date.now(), data });
      return data;
    }

    throw new Error('No se pudo consultar Sigma');
  });
}

export async function fetchTodayReports(fecha, options = {}) {
  const maxAgeMs = Math.max(0, Number(options.maxAgeMs || 0));
  const sales = await fetchSigmaReport(SALES_ENDPOINT, fecha, { maxAgeMs });
  const accounting = await fetchSigmaReport(ACCOUNTING_ENDPOINT, fecha, { maxAgeMs });
  return [sales, accounting];
}
'''
          if old not in s:
              raise SystemExit('sigma fetch target not found')
          p.write_text(s.replace(old, new, 1))

          # 2) Dashboard endpoint may reuse reports for 60 seconds.
          p = Path('api/sigma/jornadas.js')
          s = p.read_text()
          old = '      fetchTodayReports(fecha),\n'
          new = '      fetchTodayReports(fecha, { maxAgeMs: 60000 }),\n'
          if old not in s:
              raise SystemExit('jornadas fetch target not found')
          p.write_text(s.replace(old, new, 1))

          # 3) Browser/session cache: automatic dashboard reloads do not hit Sigma again.
          p = Path('src/App.tsx')
          s = p.read_text()
          old = '''  async function loadDashboard() {
