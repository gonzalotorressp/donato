          new = '''  async function loadDashboard(forceSigma = false) {
    if (!supabase) return;
    setLoadingDashboard(true);
    setDashboardError(null);
    try {
      const cacheKey = `donato:jornadas:${today}`;
      const cacheMaxAgeMs = 60000;
      let sigmaData: { jornadas?: Journey[] } | null = null;
      let sigmaCacheAt = 0;

      if (!forceSigma) {
        try {
          const raw = window.sessionStorage.getItem(cacheKey);
          if (raw) {
            const cached = JSON.parse(raw) as { at?: number; data?: { jornadas?: Journey[] } };
            if (cached.at && cached.data && Date.now() - cached.at <= cacheMaxAgeMs) {
              sigmaData = cached.data;
              sigmaCacheAt = cached.at;
            }
          }
        } catch {
          // Si el cache local está dañado, se consulta Sigma normalmente.
        }
      }

      const closurePromise = supabase
        .from('donato_cierres_caja')
        .select(closureSelect)
        .eq('fecha', today)
        .order('usuario_sigma_nombre', { ascending: true })
        .order('cierre_nro', { ascending: true });

      if (!sigmaData) {
        const headers = await authHeaders();
        const sigmaResponse = await fetch(`/api/sigma/jornadas?fecha=${today}`, { headers, cache: 'no-store' });
        if (!sigmaResponse.ok) {
          const body = await sigmaResponse.json().catch(() => ({}));
          throw new Error(body.error || 'No se pudieron consultar las cajas de hoy');
        }
        sigmaData = await sigmaResponse.json();
        sigmaCacheAt = Date.now();
        try {
          window.sessionStorage.setItem(cacheKey, JSON.stringify({ at: sigmaCacheAt, data: sigmaData }));
        } catch {
          // El cache es una optimización; la pantalla debe seguir funcionando sin él.
        }
      }

      const closureResponse = await closurePromise;
      if (closureResponse.error) throw new Error(closureResponse.error.message);
      const closureRows = (closureResponse.data ?? []) as unknown as ClosureRow[];

      // Si el cache del tablero es anterior a un corte ya congelado, no inventamos una
      // segunda jornada pendiente hasta la próxima lectura real de Sigma.
      const normalizedJourneys = (Array.isArray(sigmaData?.jornadas) ? sigmaData.jornadas : []).map((journey) => {
        if (!sigmaCacheAt) return journey;
        const latestFrozenAt = closureRows
          .filter((item) => item.estado !== 'CANCELADO' && item.usuario_sigma_codigo === journey.usuarioCodigo)
          .map((item) => item.sigma_snapshot_capturado_at ? new Date(item.sigma_snapshot_capturado_at).getTime() : 0)
          .reduce((max, value) => Math.max(max, value), 0);
        if (latestFrozenAt >= sigmaCacheAt) return { ...journey, tieneActividadNueva: false };
        return journey;
      });

      setJourneys(normalizedJourneys);
      setClosures(closureRows);
    } catch (error) {
      setDashboardError(error instanceof Error ? error.message : 'No se pudo cargar la jornada');
    } finally {
      setLoadingDashboard(false);
    }
  }
'''
          if old not in s:
