name: Patch Sigma dashboard cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Cache Sigma dashboard reports'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch cache
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Backend report cache + serialized fresh reads
          p = Path('server/sigma.js')
          s = p.read_text()
          old = '''const SIGMA_MIN_INTERVAL_MS = Math.max(0, Number(process.env.SIGMA_MIN_INTERVAL_MS || 30000));
let sigmaQueue = Promise.resolve();
let lastSigmaCallAt = 0;
'''
          new = '''const SIGMA_MIN_INTERVAL_MS = Math.max(0, Number(process.env.SIGMA_MIN_INTERVAL_MS || 30000));
let sigmaQueue = Promise.resolve();
let lastSigmaCallAt = 0;
const sigmaReportCache = new Map();
'''
          if old not in s:
              raise SystemExit('sigma constants target not found')
          s = s.replace(old, new, 1)

          old = '''export function fetchSigmaReport(endpoint, fecha) {
