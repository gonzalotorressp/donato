name: Patch quick Sigma control
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/patch_quick_control.py"
      - ".github/workflows/patch-quick-control.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quick control UI
        run: python .github/scripts/patch_quick_control.py
      - name: Commit implementation
        run: |
          git config user.name "gonzalotorressp"
          git config user.email "gonzalo@sanpablosrl.com.ar"
          git add src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add administrator quick Sigma control"
          git push
