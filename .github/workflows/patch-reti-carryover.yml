name: Patch RETI carryover

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Implement RETI carryover by cashbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python .github/scripts/patch_reti_carryover.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/sigma.js server/supabase-auth.js api/sigma/comparar.js api/sigma/snapshot.js src/App.tsx src/lib/closurePdf.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Implement RETI carryover by cashbox"
          git push
