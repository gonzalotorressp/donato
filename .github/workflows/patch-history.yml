name: Patch historical cashier closures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-history.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch history screen
        run: python3 .github/scripts/patch_history.py
      - name: Commit history implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --check
          git commit -m "Enable historical cashier sales and pending closures"
          git push
