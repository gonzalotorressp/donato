name: Patch closure reconciliation and PDF

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        shell: bash
        run: |
          if [ "${{ github.event.head_commit.message }}" = "Fix cash admin reconciliation and add closure PDF" ]; then
            echo "Patch commit detected; nothing to do."
            exit 0
          fi
          python .github/scripts/patch_close_report.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/sigma.js api/sigma/comparar.js api/sigma/snapshot.js api/sigma/jornadas.js src/App.tsx src/lib/closurePdf.ts package.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix cash admin reconciliation and add closure PDF"
          git push
