name: Patch closure reconciliation and PDF

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix cash admin reconciliation and add closure PDF'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch closure logic and PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # ---- server/sigma.js ----
          p = Path('server/sigma.js')
          s = p.read_text()
          s = s.replace(
              'export function buildUserSnapshot(sales, accounting, fecha, usuarioCodigo) {\n  const user = Number(usuarioCodigo);\n  const relevantSales = sales.filter((row) => row.fecha === fecha && Number(row.usuario) === user);\n  const relevantAccounting = accounting.filter((row) => row.fecha === fecha && Number(row.usuarioCodigo) === user);\n',
              '''export function buildUserSnapshot(sales, accounting, fecha, usuarioCodigo, cajaCodigo = null) {\n  const user = Number(usuarioCodigo);\n  const relevantSales = sales.filter((row) => row.fecha === fecha && Number(row.usuario) === user);\n  const relevantAccounting = accounting.filter((row) => row.fecha === fecha && Number(row.usuarioCodigo) === user);\n  const explicitCashAccount = Number(cajaCodigo) >= 1 && Number(cajaCodigo) <= 4\n    ? 1259 + Number(cajaCodigo)\n    : null;\n  const detectedCashAccount = Number(\n    relevantAccounting.find((row) =>\n      String(row.comprobanteCodigo || '').trim().toUpperCase() === 'CODO' &&\n      CASH_ACCOUNTS.has(Number(row.cuentaCodigo))\n    )?.cuentaCodigo || 0\n  ) || null;\n  const cashAccount = explicitCashAccount || detectedCashAccount;\n''', 1)
          s = s.replace(
              "    retiros: 0,\n    ventasDocumentos: [],",
              "    retiros: 0,\n    cajaCodigo: cashAccount ? cashAccount - 1259 : null,\n    ventasDocumentos: [],", 1)
          old_reti = '''  // RETI sigue siendo una conciliación administrativa: 130 no tiene hora y el usuario\n  // registrador puede ser un supervisor. Se congela el acumulado disponible para poder\n  // trabajar por diferencia entre cortes sin duplicarlo en cierres posteriores.\n  for (const row of relevantAccounting) {\n    if (String(row.comprobanteCodigo || '').trim().toUpperCase() !== 'RETI') continue;\n    if (!CASH_ACCOUNTS.has(Number(row.cuentaCodigo))) continue;\n    snapshot.retiros += Math.abs(number(row.monto || row.haber || row.debe));\n  }\n'''
          new_reti = '''  // RETI es un control administrativo de la CAJA, no del usuario que lo registró.\n  // En Sigma suele grabarlo un supervisor/encargado, por eso se busca por cuenta de caja.\n  // Como 130 no tiene hora, se conserva el acumulado y los cierres partidos trabajan por delta.\n  if (cashAccount) {\n    for (const row of accounting) {\n      if (row.fecha !== fecha) continue;\n      if (String(row.comprobanteCodigo || '').trim().toUpperCase() !== 'RETI') continue;\n      if (Number(row.cuentaCodigo) !== cashAccount) continue;\n      snapshot.retiros += Math.abs(number(row.monto || row.haber || row.debe));\n    }\n  }\n'''
          if old_reti not in s:
              raise SystemExit('RETI block not found')
          s = s.replace(old_reti, new_reti, 1)

          old_compare = '''  const cierreEfectivo = round2(declaration?.cierreEfectivo);\n  const totalDepositario = sumRows(declaration?.depositario);\n  const totalSupervisor = sumRows(declaration?.retirosSupervisor);\n  const totalCuentaCorriente = Array.isArray(declaration?.cuentasCorrientes)\n'''
          new_compare = '''  const cierreEfectivo = round2(declaration?.cierreEfectivo);\n  const totalDepositario = sumRows(declaration?.depositario);\n  const totalSupervisor = sumRows(declaration?.retirosSupervisor);\n  const totalCashback = sumRows(declaration?.cashbacks);\n  const totalCuentaCorriente = Array.isArray(declaration?.cuentasCorrientes)\n'''
          if old_compare not in s:
              raise SystemExit('compare totals target not found')
          s = s.replace(old_compare, new_compare, 1)
          s = s.replace(
              '  const efectivoRendido = round2(totalDepositario + totalSupervisor + cierreEfectivo);\n',
              '  const retirosDocumentados = round2(totalDepositario + totalSupervisor);\n  const efectivoRendido = round2(retirosDocumentados + cierreEfectivo);\n', 1)
          s = s.replace(
              '    retiros: round2(efectivoRendido - retirosSigma),\n',
              '    retiros: round2(retirosDocumentados - retirosSigma),\n', 1)
          old_status = '''  const conceptosOk = Object.values(coincidencias).every(Boolean);\n  const cajaOk = Math.abs(diferenciaCaja) <= toleranciaCaja;\n\n  return {\n    coincidencias,\n    conceptosOk,\n    cajaOk,\n    hayDiferencias: !conceptosOk || !cajaOk,\n'''
          new_status = '''  const conceptosOk = coincidencias.clover && coincidencias.payway && coincidencias.cuentaCorriente;\n  const administrativoOk = coincidencias.retiros;\n  const cajaOk = Math.abs(diferenciaCaja) <= toleranciaCaja;\n\n  return {\n    coincidencias,\n    conceptosOk,\n    administrativoOk,\n    cajaOk,\n    hayDiferencias: !conceptosOk || !administrativoOk || !cajaOk,\n'''
          if old_status not in s:
              raise SystemExit('comparison status target not found')
          s = s.replace(old_status, new_status, 1)
          s = s.replace(
              '    totalSigmaControlado,\n    toleranciaConceptos,\n',
              '    totalSigmaControlado,\n    retirosDocumentados,\n    totalDepositario,\n    totalSupervisor,\n    cierreEfectivo,\n    totalCashback,\n    toleranciaConceptos,\n', 1)
          p.write_text(s)

          # ---- API endpoints: use caja when building snapshot, and refresh legacy snapshots ----
          for filename in ['api/sigma/comparar.js', 'api/sigma/snapshot.js']:
              p = Path(filename)
              s = p.read_text()
              s = s.replace(
                  'buildUserSnapshot(sales, accounting, cierre.fecha, cierre.usuario_sigma_codigo)',
                  'buildUserSnapshot(sales, accounting, cierre.fecha, cierre.usuario_sigma_codigo, cierre.caja_codigo)')
              if filename.endswith('comparar.js'):
                  s = s.replace(
                      '    let snapshotTramo = cierre.sigma_snapshot_tramo;\n    if (!hasSnapshot(snapshotTramo)) {',
                      '''    let snapshotTramo = cierre.sigma_snapshot_tramo;\n    const snapshotCajaActual = hasSnapshot(snapshotTramo) && Number(snapshotTramo?.cajaCodigo || 0) === Number(cierre.caja_codigo || 0);\n    if (!snapshotCajaActual) {''', 1)
                  s = s.replace(
                      '        conceptosOk: comparison.conceptosOk,\n        cajaOk: comparison.cajaOk,',
                      '        conceptosOk: comparison.conceptosOk,\n        administrativoOk: comparison.administrativoOk,\n        cajaOk: comparison.cajaOk,', 1)
              else:
                  s = s.replace(
                      '    let snapshot = cierre.sigma_snapshot_tramo;\n    if (!hasSnapshot(snapshot)) {',
                      '''    let snapshot = cierre.sigma_snapshot_tramo;\n    const snapshotCajaActual = hasSnapshot(snapshot) && Number(snapshot?.cajaCodigo || 0) === Number(cierre.caja_codigo || 0);\n    if (!snapshotCajaActual) {''', 1)
              p.write_text(s)

          p = Path('api/sigma/jornadas.js')
          s = p.read_text()
          s = s.replace(
              'const acumuladoActual = buildUserSnapshot(sales, accounting, fecha, journey.usuarioCodigo);',
              'const acumuladoActual = buildUserSnapshot(sales, accounting, fecha, journey.usuarioCodigo, journey.cajaCodigo);')
          p.write_text(s)

          # ---- PDF generator ----
          pdf = r'''import { jsPDF } from 'jspdf';
import donatoLogo from '../../logo donato.jpg';

type MoneyRow = { referencia?: string; importe?: number };
type CurrentAccountRow = { comprobante?: string; cliente?: string; importe?: number };

export type ClosurePdfInput = {
  closure: {
    fecha: string;
    cierre_nro: number;
    estado: string;
    caja_codigo: number;
    usuario_sigma_codigo: number;
    usuario_sigma_nombre: string;
    corte_desde_at?: string | null;
    corte_hasta_at?: string | null;
    sigma_snapshot_capturado_at?: string | null;
  };
  declaration: {
    cloverFisico: number;
    paywayFisico: number;
    cierreEfectivo: number;
    depositario: MoneyRow[];
    retirosSupervisor: MoneyRow[];
    cashbacks: MoneyRow[];
    cuentasCorrientes: CurrentAccountRow[];
  };
  blindComparison?: any | null;
  snapshot?: any | null;
  fullComparison?: any | null;
  generatedBy: string;
};

const pesos = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 2 });
const num = (v: unknown) => Number(v || 0);
const total = (rows?: Array<{ importe?: number }>) => (rows || []).reduce((sum, row) => sum + num(row.importe), 0);

function dateAR(value: string) {
  const [y, m, d] = value.split('-');
  return `${d}/${m}/${y}`;
}

function timeAR(value?: string | null) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  return new Intl.DateTimeFormat('es-AR', { timeZone: 'America/Argentina/Cordoba', hour: '2-digit', minute: '2-digit', hour12: false }).format(date);
}

function statusText(status: string) {
  const labels: Record<string, string> = {
    BORRADOR: 'Borrador',
    REVISION_SUPERVISOR: 'Revision del Supervisor',
    PENDIENTE_VALIDACION: 'Pendiente de validacion',
    CERRADO: 'Cerrado',
    AJUSTES_AUTORIZADOS: 'Ajustes autorizados',
    AJUSTADO: 'Ajustado',
    CANCELADO: 'Cancelado',
  };
  return labels[status] || status;
}

async function logoDataUrl() {
  try {
    const response = await fetch(donatoLogo);
    const blob = await response.blob();
    return await new Promise<string>((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(blob);
    });
  } catch {
    return '';
  }
}

export async function downloadClosurePdf(input: ClosurePdfInput) {
  const { closure, declaration, blindComparison, snapshot, fullComparison } = input;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210;
  const margin = 15;
  let y = 15;

  const ensure = (needed = 12) => {
    if (y + needed <= 282) return;
    doc.addPage();
    y = 15;
  };
  const line = () => { doc.setDrawColor(224, 229, 238); doc.line(margin, y, W - margin, y); y += 5; };
  const section = (title: string) => {
    ensure(12);
    doc.setTextColor(24, 63, 130);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text(title, margin, y);
    y += 4;
    line();
  };
  const pair = (label: string, value: string, rightLabel?: string, rightValue?: string) => {
    ensure(9);
    doc.setFontSize(8.5);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(102, 112, 133);
    doc.text(label, margin, y);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(23, 35, 61);
    doc.text(value, margin, y + 4);
    if (rightLabel) {
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(102, 112, 133);
      doc.text(rightLabel, 108, y);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(23, 35, 61);
      doc.text(rightValue || '', 108, y + 4);
    }
    y += 11;
  };
  const tableRow = (label: string, sigmaValue: string, physicalValue: string, difference: string) => {
    ensure(8);
    doc.setFontSize(8);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(23, 35, 61);
    doc.text(label, margin, y);
    doc.text(sigmaValue, 78, y, { align: 'right' });
    doc.text(physicalValue, 132, y, { align: 'right' });
    doc.text(difference, W - margin, y, { align: 'right' });
    y += 7;
  };

  const logo = await logoDataUrl();
  if (logo) doc.addImage(logo, 'JPEG', margin, y, 24, 24);
  doc.setTextColor(24, 63, 130);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(20);
  doc.text('DONATO', logo ? 45 : margin, y + 7);
  doc.setFontSize(13);
  doc.text('Resumen de cierre de caja', logo ? 45 : margin, y + 15);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8.5);
  doc.setTextColor(102, 112, 133);
  doc.text(`Generado por ${input.generatedBy}`, logo ? 45 : margin, y + 21);
  y += 31;

  section('Identificacion del cierre');
  pair('Fecha', dateAR(closure.fecha), 'Cajero', closure.usuario_sigma_nombre);
  pair('Caja', `Caja ${closure.caja_codigo}`, 'Cierre', `Nro. ${closure.cierre_nro}`);
  pair('Usuario Sigma', String(closure.usuario_sigma_codigo), 'Estado', statusText(closure.estado));
  const cutFrom = timeAR(closure.corte_desde_at) || 'inicio';
  const cutTo = timeAR(closure.corte_hasta_at || closure.sigma_snapshot_capturado_at) || 'sin corte';
  pair('Tramo', `${cutFrom} - ${cutTo}`);

  section('Declaracion fisica del Supervisor');
  pair('Clover', pesos.format(num(declaration.cloverFisico)), 'Payway', pesos.format(num(declaration.paywayFisico)));
  pair('Tickets del depositario', pesos.format(total(declaration.depositario)), 'Retiros de supervisores', pesos.format(total(declaration.retirosSupervisor)));
  pair('Efectivo de cierre', pesos.format(num(declaration.cierreEfectivo)), 'Cashback', pesos.format(total(declaration.cashbacks)));
  pair('Cuenta corriente recibida', pesos.format(total(declaration.cuentasCorrientes)));

  if (declaration.depositario?.some((r) => num(r.importe) > 0)) {
    doc.setFontSize(8); doc.setFont('helvetica', 'bold'); doc.setTextColor(71, 84, 103); doc.text('Detalle depositario', margin, y); y += 5;
    declaration.depositario.filter((r) => num(r.importe) > 0).forEach((r) => tableRow(r.referencia || 'Sin referencia', '', pesos.format(num(r.importe)), ''));
  }
  if (declaration.retirosSupervisor?.some((r) => num(r.importe) > 0)) {
    doc.setFontSize(8); doc.setFont('helvetica', 'bold'); doc.setTextColor(71, 84, 103); doc.text('Detalle retiros de supervisores', margin, y); y += 5;
    declaration.retirosSupervisor.filter((r) => num(r.importe) > 0).forEach((r) => tableRow(r.referencia || 'Sin referencia', '', pesos.format(num(r.importe)), ''));
  }
  if (declaration.cuentasCorrientes?.length) {
    ensure(12);
    doc.setFontSize(8); doc.setFont('helvetica', 'bold'); doc.setTextColor(71, 84, 103); doc.text('Cuenta corriente', margin, y); y += 5;
    declaration.cuentasCorrientes.forEach((r) => tableRow(`${r.comprobante || 'Sin numero'} ${r.cliente || ''}`.trim(), '', pesos.format(num(r.importe)), ''));
  }

  section('Resultado del control');
  const conceptOk = fullComparison?.conceptosOk ?? blindComparison?.conceptosOk;
  const adminOk = fullComparison?.administrativoOk ?? blindComparison?.administrativoOk ?? blindComparison?.coincidencias?.retiros;
  const cashOk = fullComparison?.cajaOk ?? blindComparison?.cajaOk;
  pair('Medios / conceptos', conceptOk ? 'OK' : 'REVISAR', 'Resultado de caja', cashOk ? 'OK' : 'REVISAR');
  pair('Control administrativo RETI', adminOk ? 'OK' : 'REVISAR');

  if (snapshot && fullComparison) {
    ensure(16);
    doc.setFillColor(245, 247, 251);
    doc.rect(margin, y - 2, W - margin * 2, 8, 'F');
    doc.setFontSize(7.5); doc.setFont('helvetica', 'bold'); doc.setTextColor(71, 84, 103);
    doc.text('Concepto', margin, y + 3);
    doc.text('Sigma', 78, y + 3, { align: 'right' });
    doc.text('Fisico', 132, y + 3, { align: 'right' });
    doc.text('Diferencia', W - margin, y + 3, { align: 'right' });
    y += 12;
    const cloverSigma = num(snapshot.cloverDirecto) + num(snapshot.naranja);
    const efectivoFisico = total(declaration.depositario) + total(declaration.retirosSupervisor) + num(declaration.cierreEfectivo);
    const ccFisica = total(declaration.cuentasCorrientes);
    const retirosDoc = total(declaration.depositario) + total(declaration.retirosSupervisor);
    tableRow('Clover', pesos.format(cloverSigma), pesos.format(num(declaration.cloverFisico)), pesos.format(num(fullComparison.diferencias?.clover)));
    tableRow('Payway', pesos.format(num(snapshot.payway)), pesos.format(num(declaration.paywayFisico)), pesos.format(num(fullComparison.diferencias?.payway)));
    tableRow('Efectivo', pesos.format(num(snapshot.efectivo)), pesos.format(efectivoFisico), pesos.format(efectivoFisico - num(snapshot.efectivo)));
    tableRow('Cuenta corriente', pesos.format(num(snapshot.cuentaCorriente)), pesos.format(ccFisica), pesos.format(num(fullComparison.diferencias?.cuentaCorriente)));
    tableRow('RETI administrativo', pesos.format(num(snapshot.retiros)), pesos.format(retirosDoc), pesos.format(num(fullComparison.diferencias?.retiros)));
    ensure(13);
    doc.setFillColor(238, 244, 255);
    doc.roundedRect(margin, y, W - margin * 2, 12, 2, 2, 'F');
    doc.setFontSize(9); doc.setFont('helvetica', 'bold'); doc.setTextColor(24, 63, 130);
    doc.text('Diferencia neta de caja', margin + 4, y + 5);
    doc.text(pesos.format(num(fullComparison.diferenciaCaja)), W - margin - 4, y + 5, { align: 'right' });
    doc.setFontSize(7.5); doc.setFont('helvetica', 'normal'); doc.setTextColor(102, 112, 133);
    doc.text(`Tolerancia configurada: ${pesos.format(num(fullComparison.toleranciaCaja))}`, margin + 4, y + 9);
    y += 17;
  } else {
    ensure(12);
    doc.setFontSize(8.5); doc.setFont('helvetica', 'normal'); doc.setTextColor(102, 112, 133);
    const note = 'Este reporte respeta el control ciego: no incluye importes de Sigma ni montos de diferencias para el Supervisor.';
    doc.text(doc.splitTextToSize(note, W - margin * 2), margin, y);
    y += 10;
  }

  ensure(18);
  doc.setFillColor(255, 249, 207);
  doc.roundedRect(margin, y, W - margin * 2, 15, 2, 2, 'F');
  doc.setFontSize(7.8); doc.setFont('helvetica', 'normal'); doc.setTextColor(108, 91, 0);
  const adminNote = 'Nota: el control administrativo RETI compara los tickets del depositario y los retiros de supervisores con los RETI de la cuenta de caja en Sigma. El efectivo recibido al cierre no se considera RETI.';
  doc.text(doc.splitTextToSize(adminNote, W - margin * 2 - 8), margin + 4, y + 5);
  y += 20;

  doc.setFontSize(7); doc.setTextColor(152, 162, 179); doc.setFont('helvetica', 'normal');
  doc.text(`Documento de control interno - Donato - ${new Intl.DateTimeFormat('es-AR', { dateStyle: 'short', timeStyle: 'short', timeZone: 'America/Argentina/Cordoba' }).format(new Date())}`, margin, 290);

  const safeName = closure.usuario_sigma_nombre.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '');
  doc.save(`Cierre_Donato_${closure.fecha}_${safeName}_Cierre-${closure.cierre_nro}.pdf`);
}
'''
          Path('src/lib/closurePdf.ts').write_text(pdf)

          # ---- package.json ----
          p = Path('package.json')
          package = json.loads(p.read_text())
          package.setdefault('dependencies', {})['jspdf'] = 'latest'
          p.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n')

          # ---- App.tsx ----
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace(
              "import { supabase } from './lib/supabase';\n",
              "import { supabase } from './lib/supabase';\nimport { downloadClosurePdf } from './lib/closurePdf';\n", 1)
          s = s.replace(
              "  conceptosOk: boolean;\n  cajaOk: boolean;\n  hayDiferencias: boolean;",
              "  conceptosOk: boolean;\n  administrativoOk?: boolean;\n  cajaOk: boolean;\n  hayDiferencias: boolean;", 1)
          s = s.replace(
              "  conceptosOk: boolean;\n  cajaOk: boolean;\n  hayDiferencias: boolean;\n  diferencias:",
              "  conceptosOk: boolean;\n  administrativoOk?: boolean;\n  cajaOk: boolean;\n  hayDiferencias: boolean;\n  retirosDocumentados?: number;\n  diferencias:", 1)
          s = s.replace(
              "      { label: 'Retiros de efectivo', ok: result.coincidencias.retiros, detail: 'Tickets del depositario, supervisor y cierre' },",
              "      { label: 'Control administrativo RETI', ok: result.coincidencias.retiros, detail: 'Depositario + retiros de supervisores vs. RETI de la caja en Sigma' },", 1)
          marker = '''  function closureMeta(item: ClosureRow) {\n    const cut = displayTime(item.corte_hasta_at || item.sigma_snapshot_capturado_at);\n    return `Caja ${item.caja_codigo || '—'} · Cierre ${item.cierre_nro}${cut ? ` · ${cut}` : ''}`;\n  }\n'''
          addition = marker + '''\n  async function downloadCurrentClosurePdf() {\n    if (!closure || !selectedJourney) return;\n    setActionError(null);\n    try {\n      let reportSnapshot = snapshot;\n      let reportComparison = fullComparison;\n      if (isApprover && !reportSnapshot && ['PENDIENTE_VALIDACION', 'CERRADO', 'AJUSTES_AUTORIZADOS', 'AJUSTADO'].includes(closure.estado)) {\n        const loaded = await loadFullSnapshot(closure.id);\n        if (loaded) {\n          reportSnapshot = loaded.snapshot;\n          reportComparison = loaded.comparison;\n        }\n      }\n      await downloadClosurePdf({\n        closure: {\n          fecha: closure.fecha,\n          cierre_nro: closure.cierre_nro,\n          estado: closure.estado,\n          caja_codigo: closure.caja_codigo,\n          usuario_sigma_codigo: closure.usuario_sigma_codigo,\n          usuario_sigma_nombre: closure.usuario_sigma_nombre,\n          corte_desde_at: closure.corte_desde_at,\n          corte_hasta_at: closure.corte_hasta_at,\n          sigma_snapshot_capturado_at: closure.sigma_snapshot_capturado_at,\n        },\n        declaration,\n        blindComparison: blindComparison ?? closure.diferencias_supervisor ?? null,\n        snapshot: reportSnapshot,\n        fullComparison: reportComparison,\n        generatedBy: profile.nombre || profile.email,\n      });\n    } catch (error) {\n      setActionError(error instanceof Error ? error.message : 'No se pudo generar el PDF');\n    }\n  }\n'''
          if marker not in s:
              raise SystemExit('closureMeta marker not found')
          s = s.replace(marker, addition, 1)
          old_actions = '''  {canEditDeclaration ? (\n    <button className="cancel-closure-button header-cancel-button" type="button" onClick={() => void cancelClosure()} disabled={busy}>\n      <XCircle size={17} /> Cancelar cierre\n    </button>\n  ) : null}\n  <div className={closure.estado === 'BORRADOR' ? 'blind-badge' : `status-pill status-${closure.estado.toLowerCase()}`}>'''
          new_actions = '''  {canEditDeclaration ? (\n    <button className="cancel-closure-button header-cancel-button" type="button" onClick={() => void cancelClosure()} disabled={busy}>\n      <XCircle size={17} /> Cancelar cierre\n    </button>\n  ) : null}\n  {['PENDIENTE_VALIDACION', 'CERRADO', 'AJUSTES_AUTORIZADOS', 'AJUSTADO'].includes(closure.estado) ? (\n    <button className="refresh-button" type="button" onClick={() => void downloadCurrentClosurePdf()} disabled={busy}>\n      <FileText size={16} /> Descargar PDF\n    </button>\n  ) : null}\n  <div className={closure.estado === 'BORRADOR' ? 'blind-badge' : `status-pill status-${closure.estado.toLowerCase()}`}>'''
          if old_actions not in s:
              raise SystemExit('topbar actions target not found')
          s = s.replace(old_actions, new_actions, 1)
          s = s.replace(
              '<div className="compare-row"><div><span>RETI Sigma</span><strong>{money.format(snapshot.retiros)}</strong></div><div className="compare-arrow">→</div><div><span>Retiros documentados</span><strong>{money.format(efectivoRendido)}</strong><small className={fullComparison.coincidencias.retiros ? \'positive\' : \'negative\'}>{money.format(fullComparison.diferencias.retiros)} de diferencia administrativa</small></div></div>',
              '<div className="compare-row"><div><span>RETI Sigma · Caja {closure.caja_codigo}</span><strong>{money.format(snapshot.retiros)}</strong><small>Control por cuenta de caja, sin importar qué usuario registró el RETI</small></div><div className="compare-arrow">→</div><div><span>Retiros documentados</span><strong>{money.format(totalDepositario + totalSupervisor)}</strong><small className={fullComparison.coincidencias.retiros ? \'positive\' : \'negative\'}>{money.format(fullComparison.diferencias.retiros)} de diferencia administrativa · no incluye efectivo de cierre</small></div></div>', 1)
          p.write_text(s)
          PY
