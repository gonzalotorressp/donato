name: Autofix Supabase casts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Supabase strict type casts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply cast fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace("setClosures((closureResponse.data ?? []) as ClosureRow[]);", "setClosures((closureResponse.data ?? []) as unknown as ClosureRow[]);")
          s = s.replace("Number((data as ClosureRow).cierre_nro", "Number((data as unknown as ClosureRow).cierre_nro")
          s = s.replace("setClosure(data as ClosureRow);", "setClosure(data as unknown as ClosureRow);")
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix Supabase strict type casts"
            git push
          fi
